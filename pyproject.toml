[project]
name = "LiNak"
version = "1.3.0"
description = "An integrated computational toolkit for alkali-atom AMO physics"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "LiNaK contributors" },
]
dependencies = [
    "numpy>=1.22",
    "plotly>=5.0",
    "pyside6>=6.5",
    "scipy>=1.9",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pyinstaller>=6.0",
]

[project.scripts]
linak = "linak.cli:main"
linak-gui = "linak.gui.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]



[project.optional-dependencies]
arc = [
    "arc-alkali-rydberg-calculator",
]
basis = [
    "basis-set-exchange",
]
web = [
    "pyside6-addons>=6.5",
]