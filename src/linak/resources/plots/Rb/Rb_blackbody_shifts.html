  function interp(xs, ys, x){
    if (x <= xs[0]) return ys[0];
    if (x >= xs[xs.length-1]) return ys[ys.length-1];

    while (hi-lo>1){ const mid=(lo+hi)>>1; if (xs[mid] <= x) lo=mid; else hi=mid; }

    return ys[lo]*(1-t) + ys[hi]*t;
