<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><title>$!TITLE</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>

:root{
  --bg:#fcfcfb; --panel:#f3f2ef; --edge:#dedcd6; --ink:#161513; --ink2:#55534e; --muted:#7d7a73; --grid:#e8e6e1;
  --nist:#2a78d6; --soc:#eb6834; --td:#6250d6; --line:#6b6963; --band:#e5f1ec; --cont:#efeeea; --sel:#0e9f6e; --hl:#fff3c4;
  --r-xray:#6b2fd6; --r-vuv:#7a3fe0; --r-uv:#2a5bd6; --r-vis:#e8710a; --r-nir:#c8261c; --r-mir:#7a7770; --r-mic:#9a978f; --qdt:#7fa6dc; --theo:#b03aa8; --ov3:#2e8b57; --ov4:#a23b72; --ov5:#c08a00; --ov6:#4a7a96;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171716; --panel:#212120; --edge:#34332f; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8d86; --grid:#2b2a28;
  --nist:#3987e5; --soc:#d95926; --td:#9085e9; --line:#9d9b94; --band:#1e2e28; --cont:#1f1f1d; --sel:#2dd4a0; --hl:#4a4220;
  --r-xray:#a98af5; --r-vuv:#a98af5; --r-uv:#5b8cf0; --r-vis:#f08a2d; --r-nir:#ee5d52; --r-mir:#a09d95; --r-mic:#c3c1ba; --qdt:#5d86bd; --theo:#d77fd0; --ov3:#4fc18a; --ov4:#d777a8; --ov5:#e0b030; --ov6:#7fb0cc; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171716; --panel:#212120; --edge:#34332f; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8d86; --grid:#2b2a28;
  --nist:#3987e5; --soc:#d95926; --td:#9085e9; --line:#9d9b94; --band:#1e2e28; --cont:#1f1f1d; --sel:#2dd4a0; --hl:#4a4220;
  --r-xray:#a98af5; --r-vuv:#a98af5; --r-uv:#5b8cf0; --r-vis:#f08a2d; --r-nir:#ee5d52; --r-mir:#a09d95; --r-mic:#c3c1ba; --qdt:#5d86bd; --theo:#d77fd0; --ov3:#4fc18a; --ov4:#d777a8; --ov5:#e0b030; --ov6:#7fb0cc; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;margin:0;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-bottom:12px}
h1{font-size:21px;font-weight:600;margin:0;letter-spacing:-.01em}
.sub{color:var(--ink2);font-size:13px}
.tag{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--edge);border-radius:4px;padding:1px 6px}
.hdr-btns{margin-left:auto;display:flex;gap:8px}
.app{display:grid;grid-template-columns:292px minmax(0,1fr);gap:14px;align-items:start}
.app.closed{grid-template-columns:minmax(0,1fr)}
.app.closed .rail{display:none}
@media(max-width:900px){.app{grid-template-columns:minmax(0,1fr)}}
.rail{background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:14px}
.rail h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600}
.row{display:flex;align-items:center;gap:8px;margin:4px 0;min-width:0}
.row label{flex:1;min-width:0;cursor:pointer}
.row .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.chip{width:12px;height:12px;border-radius:3px;flex:none}
.bar{width:16px;height:0;border-top:3px solid;flex:none;border-radius:2px}
input[type=checkbox],input[type=radio]{accent-color:var(--nist);margin:0}
input[type=range]{width:100%;accent-color:var(--nist)}
input[type=number],input[type=search],input[type=text]{background:var(--bg);color:var(--ink);border:1px solid var(--edge);border-radius:5px;padding:4px 6px;font:inherit;font-size:12.5px;min-width:0;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lbl{font-size:12px;color:var(--ink2);margin:6px 0 3px}
.sl{margin:6px 0}.sl .top{display:flex;justify-content:space-between;color:var(--ink2);font-size:12.5px}
.sl .v{font-family:var(--mono);font-size:12px;color:var(--ink)}
.seg{display:flex;border:1px solid var(--edge);border-radius:6px;overflow:hidden}
.seg button{flex:1;background:transparent;color:var(--ink2);border:0;padding:5px 2px;font:inherit;font-size:12.5px;cursor:pointer}
.seg button+button{border-left:1px solid var(--edge)}
.seg button[aria-pressed=true]{background:var(--nist);color:#fff}
.checks{display:flex;flex-wrap:wrap;gap:4px 12px}
.checks label{display:flex;align-items:center;gap:5px;cursor:pointer;font-size:12.5px}
.hint{color:var(--muted);font-size:11.5px;margin-top:3px;line-height:1.4}
.main{min-width:0;display:flex;flex-direction:column;gap:10px}
.plot{border:1px solid var(--edge);border-radius:8px;background:var(--bg);overflow:hidden}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px 0;flex-wrap:wrap}
.count{font-size:12.5px;color:var(--ink2)}
#plot{width:100%;height:680px}
.note{color:var(--ink2);font-size:12.5px;line-height:1.5;max-width:100ch;margin:0}
.card{border:1px solid var(--edge);border-radius:8px;padding:10px 12px;min-width:0}
.card .bar2{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.card .bar2 b{font-size:13px;font-weight:600;margin-right:auto}
.btn{background:transparent;color:var(--ink);border:1px solid var(--edge);border-radius:6px;padding:4px 10px;font:inherit;font-size:12.5px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--nist);border-color:var(--nist);color:#fff}
.btn[disabled]{opacity:.45;cursor:default}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:4px 12px 4px 0;border-bottom:1px solid var(--grid);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:11.5px;cursor:pointer;user-select:none}
th.nosort{cursor:default}
th .arr{font-size:9px;margin-left:3px}
td.m{font-family:var(--mono);font-size:12px}
tbody tr.t{cursor:pointer;user-select:none;-webkit-user-select:none}
#plot,.ptop{user-select:none;-webkit-user-select:none}
tbody tr.t:hover{background:var(--panel)}
tbody tr.sel{background:var(--hl)}
.empty{color:var(--muted);font-size:12.5px}
.pager{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink2)}
.j{font-size:.85em;vertical-align:sub;line-height:0}
.cm{position:fixed;z-index:50;background:var(--bg);border:1px solid var(--edge);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.22);padding:4px;min-width:200px}
.cm button{display:block;width:100%;text-align:left;background:transparent;color:var(--ink);border:0;border-radius:5px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.cm button:hover{background:var(--panel)}
.ov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--bg);color:var(--ink);border:1px solid var(--edge);border-radius:10px;max-width:720px;width:100%;max-height:88vh;overflow:auto;padding:16px 18px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.dlg h3{margin:0 0 2px;font-size:17px}
.dlg h4{margin:14px 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dlg .g{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:2px 12px;font-size:13px}
.dlg .g span:nth-child(odd){color:var(--ink2)}
.dlg .g span:nth-child(even){font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--edge);border-radius:4px;padding:0 4px}
.rail h2{cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px}
.rail h2::before{content:'▾';font-size:10px;width:10px;display:inline-block;transition:transform .12s}
.rail section.shut>h2::before{transform:rotate(-90deg)}
.rail section.shut>*:not(h2){display:none}
.rail section.shut>h2{margin-bottom:0}
.rail h2:focus-visible{outline:2px solid var(--nist);outline-offset:2px;border-radius:3px}
.railtools{display:flex;gap:8px}.railtools .btn{flex:1}
@media print{header,.rail,.note,.card,.ptop button,.cm,.ov{display:none!important}.app{display:block}body{background:#fff}}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--edge);margin-bottom:2px}
.tabs button{background:transparent;color:var(--ink2);border:0;border-bottom:2px solid transparent;padding:8px 14px;font:inherit;font-size:13.5px;cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--nist);font-weight:600}
.tabs button:focus-visible{outline:2px solid var(--nist);outline-offset:-2px;border-radius:4px}
.pane[hidden]{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.stat{border:1px solid var(--edge);border-radius:8px;padding:6px 10px;min-width:150px}
.stat .k{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.stat .v{font-family:var(--mono);font-size:14px;margin-top:1px}
.stat .d{font-size:11.5px;color:var(--ink2)}
.p{height:560px}.p.short{height:520px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
@media(max-width:1100px){.cols{grid-template-columns:minmax(0,1fr)}}
.pillrow{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--edge);border-radius:999px;padding:2px 9px;font-size:12px;cursor:pointer;background:transparent;color:var(--ink2)}
.pill[aria-pressed=true]{background:var(--nist);border-color:var(--nist);color:#fff}
tr.sel td{background:var(--hl)}
.cls{display:inline-block;border-radius:4px;padding:0 6px;font-size:11.5px;border:1px solid var(--edge)}
.cls.robust{color:var(--sel);border-color:var(--sel)}.cls.sensitive{color:var(--ov5);border-color:var(--ov5)}.cls.very{color:var(--r-nir);border-color:var(--r-nir)}
.shr{display:inline-block;height:8px;background:var(--nist);border-radius:2px;vertical-align:middle;opacity:.75}
.shr.neg{background:var(--soc)}
@media print{header,.rail,.tabs,.note,.card,.stat,.chips,.cm{display:none!important}.app{display:block}body{background:#fff}.pane[hidden]{display:none}}

.pg{display:flex;align-items:center}.pg .pill:disabled{opacity:.4;cursor:default}

</style>
<style>
select{background:var(--bg);color:var(--ink);border:1px solid var(--edge);border-radius:5px;padding:4px 6px;font:inherit;font-size:12.5px;width:100%}
.p.tall{height:640px}
.stat .k{text-transform:none;letter-spacing:0}
.vp{position:relative;height:640px;background:#05060c;overflow:hidden}
.vp canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#glcanvas{cursor:grab;touch-action:none}#glcanvas:active{cursor:grabbing}
#overlay{pointer-events:none}
#isodiv{position:absolute;inset:0;display:none}
#legend{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:none;text-align:center;pointer-events:none;font-size:11px;color:#c3c8d8;background:rgba(10,10,22,.78);border:1px solid #2a2a4a;border-radius:8px;padding:6px 12px 7px}
#legend canvas{position:static;display:block;margin:4px auto 3px;border:1px solid #2a2a4a;width:240px;height:12px}
#legend .ends{display:flex;justify-content:space-between;font-size:10px;color:#9aa3bd}
#vpmsg{position:absolute;top:10px;left:12px;font-size:12px;color:#c3c8d8;pointer-events:none}
#vptitle{position:absolute;top:10px;right:12px;font-size:12.5px;color:#e6e8f0;pointer-events:none;text-align:right}
#glfb{display:none;position:absolute;inset:0;align-items:center;justify-content:center;text-align:center;color:#c3c8d8;padding:30px}
.slist{max-height:340px;overflow-y:auto;border:1px solid var(--edge);border-radius:6px;background:var(--bg)}
.srow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:4px 8px;cursor:pointer;font-size:12.5px;border-left:2px solid transparent}
.srow:hover{background:var(--panel)}
.srow.on{background:var(--hl);border-left-color:var(--nist)}
.srow .ns{font-family:var(--mono);font-size:11px;color:var(--muted)}
.srow .tg{font-size:10.5px;color:var(--muted)}
.srow .gs{font-size:10px;color:var(--sel);margin-left:4px}
.grp{font-size:11.5px;color:var(--ink2);margin:8px 0 4px}
.pins{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pin{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--edge);border-radius:999px;padding:1px 4px 1px 8px;font-size:12px}
.pin button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:12px;padding:0 3px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.meth{display:inline-block;border-radius:4px;padding:0 6px;font-size:11px;border:1px solid var(--edge)}
.meth.model{color:var(--sel);border-color:var(--sel)}.meth.hydrogenic{color:var(--nist);border-color:var(--nist)}.meth.coulomb{color:var(--ov5);border-color:var(--ov5)}
tbody tr.t.sel td{background:var(--hl)}
</style>
</head>
<body>
<header>
  <h1 id="h1"></h1>
  <span class="sub" id="sub"></span>
  <div class="hdr-btns">
    <button class="btn" id="exportbtn" aria-haspopup="menu">Export ▾</button>
    <button class="btn" id="railbtn" aria-expanded="true">Hide controls</button>
    <button class="btn" id="theme" aria-label="Switch theme">Theme: auto</button>
  </div>
</header>
<div class="app" id="app">
  <aside class="rail" aria-label="Controls">
    <section class="railtools"><button class="btn" id="colall">Collapse all</button><button class="btn" id="expall">Expand all</button></section>
    <section><h2>State</h2>
      <div class="pillrow" id="lfilt" role="group" aria-label="Series"></div>
      <div class="slist" id="slist" style="margin-top:8px"></div>
    </section>
    <section><h2>Sub-state</h2>
      <div id="subs"></div>
      <div class="hint" id="subnote"></div>
    </section>
    <section><h2>Display</h2>
      <div class="lbl">Channel</div>
      <div class="seg" id="chan" role="group" aria-label="Channel"><button data-v="0">Density</button><button data-v="1">Re ψ</button><button data-v="2">Im ψ</button><button data-v="3">Phase</button></div>
      <div class="lbl" style="margin-top:6px">Density scale</div>
      <select id="dscale" aria-label="Density scale"><option value="0">Linear |ψ|²</option><option value="1">Amplitude |ψ|</option><option value="2">Logarithmic</option></select>
      <div class="lbl" style="margin-top:6px">Colour scale set by</div>
      <div class="seg" id="norm" role="group" aria-label="Colour scale reference"><button data-v="val">Max outside core</button><button data-v="all">Global max</button></div>
      <div class="lbl" style="margin-top:6px">Colour map</div>
      <select id="cmap" aria-label="Colour map"><option value="0">Inferno</option><option value="1">Viridis</option><option value="2">Plasma</option><option value="3">Hot</option><option value="4">Electric</option></select>
$!RENDER_CTRL
    </section>
    <section><h2>View</h2>
      <div class="lbl">Length unit</div>
      <div class="seg" id="unit" role="group" aria-label="Length unit"><button data-v="a0">a₀</button><button data-v="A">Å</button><button data-v="nm">nm</button></div>
      <div class="lbl" style="margin-top:6px">Slice plane</div>
      <div class="seg" id="plane" role="group" aria-label="Slice plane"><button data-v="xz">x–z (contains z)</button><button data-v="xy">x–y</button></div>
      <div class="lbl" style="margin-top:6px">Radial plot</div>
      <div class="seg" id="rq" role="group" aria-label="Radial quantity"><button data-v="P">P(r) = u²</button><button data-v="u">u(r) = rR</button></div>
      <div class="checks" style="margin-top:6px"><label><input type="checkbox" id="rlog"> Log r</label></div>
      <div class="lbl" style="margin-top:6px">Compare states (Radial tab)</div>
      <button class="btn" id="pinbtn" style="width:100%">Add the current state</button>
      <div class="pins" id="pins"></div>
      <button class="btn" id="resetview" style="width:100%;margin-top:10px">Reset 3D view</button>
    </section>
  </aside>
  <div class="main">
    <div class="chips" id="stats"></div>
    <div class="tabs" role="tablist" aria-label="Views">
      <button role="tab" id="tab-3d" aria-controls="pane-3d" data-t="3d">3D</button>
      <button role="tab" id="tab-sl" aria-controls="pane-sl" data-t="sl">Slice</button>
      <button role="tab" id="tab-rad" aria-controls="pane-rad" data-t="rad">Radial</button>
      <button role="tab" id="tab-val" aria-controls="pane-val" data-t="val">Values</button>
      <button role="tab" id="tab-sc" aria-controls="pane-sc" data-t="sc">Scaling</button>
    </div>
    <section class="pane" id="pane-3d" role="tabpanel" aria-labelledby="tab-3d">
      <div class="plot"><div class="vp" id="vp">
        <canvas id="glcanvas"></canvas><canvas id="overlay"></canvas><div id="isodiv"></div>
        <div id="legend"><div id="lg-title"></div><canvas id="lg-bar" width="240" height="12"></canvas><div class="ends"><span id="lg-lo"></span><span id="lg-mid"></span><span id="lg-hi"></span></div></div>
        <div id="vpmsg"></div><div id="vptitle"></div>
        <div id="glfb"><div></div></div>
      </div></div>
      <p class="note" id="n3d"></p>
    </section>
    <section class="pane" id="pane-sl" role="tabpanel" aria-labelledby="tab-sl" hidden>
      <div class="plot"><div class="ptop"><span class="count" id="slinfo"></span></div><div class="p tall" id="psl"></div></div>
      <p class="note" id="nsl"></p>
    </section>
    <section class="pane" id="pane-rad" role="tabpanel" aria-labelledby="tab-rad" hidden>
      <div class="plot"><div class="ptop"><span class="count" id="radinfo"></span></div><div class="p tall" id="prad"></div></div>
      <p class="note" id="nrad"></p>
    </section>
    <section class="pane" id="pane-val" role="tabpanel" aria-labelledby="tab-val" hidden>
      <div class="card"><div class="tw"><table id="vtab"><thead></thead><tbody></tbody></table></div></div>
      <p class="note" id="nval"></p>
    </section>
    <section class="pane" id="pane-sc" role="tabpanel" aria-labelledby="tab-sc" hidden>
      <div class="plot"><div class="ptop"><span class="count" id="scinfo"></span></div><div class="p tall" id="psc"></div></div>
      <p class="note" id="nsc"></p>
    </section>
  </div>
</div>
<script id="orbcore">
// ---- shared by the page and the 3D worker ----
function legSc(l, am, x) {
  let fct = 1;
  for (let i = 1; i <= am; i++) fct *= (2 * i - 1);
  let Pmm = fct * Math.pow(Math.max(1 - x * x, 0), am / 2) * (am % 2 ? -1 : 1);
  if (l === am) return Pmm;
  let Pm1 = (2 * am + 1) * x * Pmm, Pk = 0;
  if (l === am + 1) return Pm1;
  for (let k = am + 2; k <= l; k++) { Pk = ((2 * k - 1) * x * Pm1 - (k + am - 1) * Pmm) / (k - am); Pmm = Pm1; Pm1 = Pk; }
  return Pm1;
}
function lmNorm(l, am) { let r = 1; for (let i = l - am + 1; i <= l + am; i++) r *= i; return Math.sqrt((2 * l + 1) / (4 * Math.PI) / r); }
function Y2(l, m, c) { const am = Math.abs(m); if (am > l) return 0; const P = legSc(l, am, c), N = lmNorm(l, am); return N * N * P * P; }
function YlmReal(l, m, c, phi) {
  const am = Math.abs(m), P = legSc(l, am, c), N = lmNorm(l, am);
  if (m === 0) return N * P;
  return m > 0 ? Math.SQRT2 * N * P * Math.cos(m * phi) : Math.SQRT2 * N * P * Math.sin(am * phi);
}
function YlmComplex(l, m, c, phi) { const am = Math.abs(m), P = legSc(l, am, c), N = lmNorm(l, am); return [N * P * Math.cos(m * phi), N * P * Math.sin(m * phi)]; }
// spin-summed angular density of |l, j, m_j>, j = l ± 1/2 (integrates to 1)
function rhoMj(l, jT, mjT, c) {
  const mj = mjT / 2, plus = (jT === 2 * l + 1);
  const cu = plus ? (l + mj + 0.5) / (2 * l + 1) : (l - mj + 0.5) / (2 * l + 1);
  const cd = plus ? (l - mj + 0.5) / (2 * l + 1) : (l + mj + 0.5) / (2 * l + 1);
  return cu * Y2(l, mj - 0.5, c) + cd * Y2(l, mj + 0.5, c);
}
// R(r) = u(r)/r from the shipped table (uniform in ln r); R ∝ r^l below the first point
function makeRadial(u, x0, dx, l) {
  const n = u.length, r0 = Math.exp(x0), rEnd = Math.exp(x0 + (n - 1) * dx);
  return function (r) {
    if (r >= rEnd) return 0;
    if (r <= r0) return u[0] / r0 * Math.pow(r / r0, l);

    return (u[i] * (1 - t) + u[i + 1] * t) / r;

}
// [density, Re psi, Im psi] at (x, y, z) for the chosen sub-state
function psiAt(q, R, x, y, z) {

  if (q.kind === 'mj') return [Rv * Rv * rhoMj(q.l, q.jT, q.mjT, c), 0, 0];
  const phi = Math.atan2(y, x);
  if (q.basis === 'real') { const re = Rv * YlmReal(q.l, q.m, c, phi); return [re * re, re, 0]; }
  const yc = YlmComplex(q.l, q.m, c, phi), re = Rv * yc[0], im = Rv * yc[1];
  return [re * re + im * im, re, im];
}
