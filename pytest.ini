# Pytest configuration for the Alkali AMO pipeline.
# Keep all test code and artifacts under tests/ (do not scatter into data_json/ or plots/).

[pytest]
testpaths = tests
pythonpath = . tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
cache_dir = tests/results/.pytest_cache
addopts =
    -ra
    --tb=short
    --junitxml=tests/results/junit.xml
filterwarnings =
    ignore::DeprecationWarning
