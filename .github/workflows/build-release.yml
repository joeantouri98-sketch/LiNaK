name: Build release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    name: Windows executable
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build executable
        shell: pwsh
        run: .\packaging\build_windows.ps1 -Clean

      - name: Archive executable
        shell: pwsh
        run: Compress-Archive -Path dist\windows\LiNaK -DestinationPath LiNaK-windows-${{ github.ref_name }}.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiNaK-windows-${{ github.ref_name }}
          path: LiNaK-windows-${{ github.ref_name }}.zip

  macos-app:
    name: macOS application
    runs-on: macos-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install build dependencies
        run: uv sync --dev

      - name: Build application
        run: uv run pyinstaller --noconfirm --clean packaging/LiNaK.spec

      - name: Archive application
        run: ditto -c -k --sequesterRsrc --keepParent dist/LiNaK.app LiNaK-macos-${{ github.ref_name }}.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiNaK-macos-${{ github.ref_name }}
          path: LiNaK-macos-${{ github.ref_name }}.zip
